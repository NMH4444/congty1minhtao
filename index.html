<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Công Ty 1 Mình Tao · Cổng Giám Sát Bot MT5</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 10%, #172554 0%, #080d17 70%);
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.25);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7), 0 0 30px rgba(56, 189, 248, 0.15);
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      backdrop-filter: blur(12px);
    }
    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: 0 8px 20px rgba(56, 189, 248, 0.35);
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #f8fafc;
      margin-bottom: 6px;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 4px 10px;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      margin-bottom: 20px;
    }
    .status-box {
      background: rgba(2, 6, 23, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 20px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      margin: 0 auto 12px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-text {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
    }
    .status-text strong {
      color: #38bdf8;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 13px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-secondary {
      background: rgba(30, 41, 59, 0.8);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: none;
      margin-top: 10px;
    }
    .btn-hidden {
      display: none;
    }
    .footer {
      margin-top: 24px;
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">⚡</div>
    <h1>Công Ty 1 Mình Tao</h1>
    <div class="badge">Cổng Cố Định · CCBSN v3.0.6</div>

    <div class="status-box">
      <div id="loader" class="spinner"></div>
      <div id="status" class="status-text">
        Đang đồng bộ địa chỉ Web Monitor từ máy tính...
      </div>
    </div>

    <a id="directBtn" href="#" class="btn btn-hidden">Mở Web Monitor Ngay</a>
    <button id="retryBtn" class="btn btn-secondary btn-hidden" onclick="checkRedirect()">Thử lại kết nối</button>

    <div class="footer">
      Địa chỉ cố định vĩnh viễn · Tự động điều hướng
    </div>
  </div>

  <script>
    const GIST_URL = "https://api.github.com/gists/9ca05a6b536cb4cc7d6a525712347588";
    let retryTimer = null;

    async function checkRedirect() {
      const statusEl = document.getElementById("status");
      const loaderEl = document.getElementById("loader");
      const directBtn = document.getElementById("directBtn");
      const retryBtn = document.getElementById("retryBtn");

      if (retryTimer) clearTimeout(retryTimer);
      loaderEl.style.display = "block";
      directBtn.classList.add("btn-hidden");
      retryBtn.classList.add("btn-hidden");
      statusEl.innerHTML = "Đang kết nối hệ thống...";

      try {
        const res = await fetch(GIST_URL + "?t=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        const contentStr = data.files && data.files["target.json"] && data.files["target.json"].content;
        const config = JSON.parse(contentStr || "{}");

        if (config.url && config.status === "ONLINE") {
          statusEl.innerHTML = "<strong>Đã kết nối!</strong><br>Đang chuyển tiếp vào màn hình giám sát...";
          directBtn.href = config.url;
          directBtn.classList.remove("btn-hidden");
          window.location.replace(config.url);
        } else {
          loaderEl.style.display = "none";
          statusEl.innerHTML = "🔴 <strong>Web Monitor đang TẮT</strong><br>Máy tính hiện chưa bật web hoặc MT5 đang nghỉ.<br><br>👉 Anh bấm icon <strong>Công Tắc Web Monitor</strong> trên Desktop để BẬT lại.";
          retryBtn.classList.remove("btn-hidden");
          retryTimer = setTimeout(checkRedirect, 5000);
        }
      } catch (err) {
        loaderEl.style.display = "none";
        statusEl.innerHTML = "⚠️ <strong>Không thể kết nối máy chủ điều hướng</strong><br>Vui lòng kiểm tra lại kết nối mạng.";
        retryBtn.classList.remove("btn-hidden");
        retryTimer = setTimeout(checkRedirect, 7000);
      }
    }

    checkRedirect();
  </script>
</body>
</html>
